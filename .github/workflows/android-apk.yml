name: Build Miki's World Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'port/MikisWorld.Android/**'
      - 'port/MikisWorld.Core/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android ARM64 APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'false'
          packages: ''

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: |
          dotnet restore port/MikisWorld.Android/MikisWorld.Android.csproj

      - name: Build APK
        run: |
          dotnet publish port/MikisWorld.Android/MikisWorld.Android.csproj \
            --configuration Debug \
            --framework net10.0-android36.0 \
            -p:AndroidPackageFormat=apk \
            -p:AndroidSdkDirectory="$ANDROID_HOME"

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find port/MikisWorld.Android/bin/Debug/net10.0-android36.0 \
            -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi encontrado."
            find port/MikisWorld.Android/bin -type f | head -100
            exit 1
          fi

          mkdir -p artifacts
          cp "$APK" artifacts/MikisWorld-Android-ARM64.apk
          echo "path=artifacts/MikisWorld-Android-ARM64.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MikisWorld-Android-ARM64
          path: artifacts/MikisWorld-Android-ARM64.apk
          if-no-files-found: error
          retention-days: 14
